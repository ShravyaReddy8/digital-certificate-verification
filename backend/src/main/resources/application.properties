spring.application.name=digital-certificate-verification

# ---------------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------------
server.port=8080
server.error.include-message=never

# ---------------------------------------------------------------------------
# H2 file-based database (default - zero setup required)
# Data is persisted in ./data/certverify.mv.db
# Switch to MySQL with: --spring.profiles.active=mysql
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/certverify;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Upload limits
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=16MB

# ---------------------------------------------------------------------------
# Application settings
# ---------------------------------------------------------------------------
# JWT secret must be at least 32 characters. Change this in production.
app.jwt.secret=change-this-super-secret-jwt-signing-key-please-1234567890
app.jwt.expiration-ms=86400000
# Directory where certificate files, QR codes and the RSA key pair are stored
app.upload-dir=uploads
# Used to build QR links and the verification URL returned to clients
app.frontend-url=http://localhost:5173
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3001

logging.level.org.springframework.security=INFO
logging.level.com.certverify=INFO
