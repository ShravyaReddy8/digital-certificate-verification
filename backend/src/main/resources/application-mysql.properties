# ---------------------------------------------------------------------------
# MySQL configuration (optional)
#
# The application uses a zero-setup H2 file database by default.
# To run against MySQL instead:
#
#   1. Create a database:
#        CREATE DATABASE certverify CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
#   2. Uncomment the settings below and adjust username/password.
#   3. Start the backend with:
#        mvn spring-boot:run -Dspring-boot.run.profiles=mysql
#      (or: java -jar target/*.jar --spring.profiles.active=mysql)
#
# The mysql-connector-j driver is already declared in pom.xml.
# ---------------------------------------------------------------------------

#spring.datasource.url=jdbc:mysql://localhost:3306/certverify?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.datasource.username=root
#spring.datasource.password=yourpassword
#
#spring.jpa.hibernate.ddl-auto=update
#spring.jpa.open-in-view=false
#spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
#spring.jpa.properties.hibernate.jdbc.time_zone=UTC
#
## Keep the same application secrets / paths as the default profile
#app.jwt.secret=change-this-super-secret-jwt-signing-key-please-1234567890
#app.jwt.expiration-ms=86400000
#app.upload-dir=uploads
